name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      # `npm ci` (not `npm install`) so a package.json/lockfile drift fails
      # loudly rather than being silently resolved.
      - run: npm ci
      - run: npx prettier --check "**/*.{ts,tsx,md}"
      # One invocation: `lint` and `test` both dependsOn ^build, so turbo
      # schedules the whole graph and shares build output instead of
      # rebuilding per task.
      - run: npx turbo run build lint test
